name: Build BMW AA Bridge APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo '::error::Android SDK manager not found in the runner SDK'
            exit 1
          fi
          echo "Using $SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack source ZIP
        shell: bash
        run: |
          mkdir -p bridge
          unzip -q bmw-native-aa-bridge-v0.1.1-source.zip -d bridge
          test -f bridge/settings.gradle.kts

      - name: Run source tests and build APK
        working-directory: bridge
        run: |
          python3 -m unittest discover -s tests -v
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BMW-AA-Bridge-APK
          path: bridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

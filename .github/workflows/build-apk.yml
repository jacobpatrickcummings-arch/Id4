name: Build BMW AA Bridge APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo '::error::Android SDK manager not found in the runner SDK'
            exit 1
          fi
          echo "Using $SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack source ZIP
        shell: bash
        run: |
          mkdir -p bridge
          unzip -q bmw-native-aa-bridge-v0.1.1-source.zip -d bridge
          test -f bridge/settings.gradle.kts

      - name: Add missing BMW iDrive protocol dependency
        shell: bash
        run: |
          python3 - <<'PYBUILD'
          from pathlib import Path
          f = Path('bridge/app/build.gradle.kts')
          s = f.read_text()
          # Align with the versions used by AAIdrive's main app.
          s = s.replace('io.bimmergestalt:IDriveConnectKitAndroid:0.6',
                        'io.bimmergestalt:IDriveConnectKitAndroid:0.7')
          dependency = 'implementation("io.bimmergestalt.idriveconnectkit:idriveconnectkit:0.8")'
          if dependency not in s:
              marker = 'implementation("io.bimmergestalt:IDriveConnectKitAndroid:0.7")'
              if marker not in s:
                  raise SystemExit('Expected Android iDrive dependency missing; check source archive')
              s = s.replace(marker, marker + '\n    ' + dependency)
          f.write_text(s)
          print('Added core iDrive protocol dependency')
          PYBUILD

      - name: Run source tests and build APK
        working-directory: bridge
        run: |
          python3 -m unittest discover -s tests -v
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BMW-AA-Bridge-APK
          path: bridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
